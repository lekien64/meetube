# Build a debug APK for testing translations. No release keystore secrets are needed.
# Run manually from Actions > Build Debug APK > Run workflow.
name: Build Debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :mobile:assembleStmobileDebug

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp mobile/build/outputs/renamed_apks/stmobileDebug/*.apk dist/
          ls -lh dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MeeTube-Vietnamese-Debug
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 7
